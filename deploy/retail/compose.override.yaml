{
  "services": {
    "ui": {
      "environment": {
        "OTEL_SDK_DISABLED": "false",
        "OTEL_EXPORTER_OTLP_PROTOCOL": "http/protobuf",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://retail-collector:4318",
        "OTEL_METRICS_EXPORTER": "none",
        "OTEL_LOGS_EXPORTER": "none",
        "OTEL_PROPAGATORS": "tracecontext,baggage",
        "OTEL_RESOURCE_PROVIDERS_AWS_ENABLED": "false",
        "OTEL_BSP_SCHEDULE_DELAY": "1000",
        "OTEL_SERVICE_NAME": "ui",
        "OTEL_RESOURCE_ATTRIBUTES": "service.namespace=aws-retail,deployment.environment=dotops-lab",
        "OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED": "true"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "labels": "com.docker.compose.service"
        }
      }
    },
