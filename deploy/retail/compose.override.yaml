        "options": {
          "max-size": "10m",
          "max-file": "3",
          "labels": "com.docker.compose.service"
        }
      }
    },
    "retail-collector": {
      "image": "otel/opentelemetry-collector-contrib:0.111.0",
      "user": "0",
      "command": [
        "--config=/etc/otelcol/config.yaml"
      ],
      "volumes": [
        "./observability/collector.yaml:/etc/otelcol/config.yaml:ro",
        "/var/lib/docker/containers:/hostlogs:ro",
        "collector-state:/var/lib/otelcol"
      ],
      "ports": [
        "192.168.108.128:8889:8889"
      ],
      "restart": "unless-stopped",
      "mem_limit": "256m"
    },
    "node-exporter": {
      "image": "prom/node-exporter:v1.8.2",
      "command": [
        "--path.rootfs=/host",
        "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/.+)($|/)"
      ],
      "volumes": [
        "/:/host:ro,rslave"
      ],
      "pid": "host",
      "restart": "unless-stopped",
      "mem_limit": "96m"
    }
  },
  "volumes": {
    "collector-state": {}
  }
}
