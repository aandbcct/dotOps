name: dotops-test
services:
  test-web:
    image: nginx:alpine
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./deploy/test-web/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [dotops]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
networks:
  dotops:
    # 复用本地平台网络，后端可通过 test-web 访问测试服务。
    external: true
    name: dotops-local_default
