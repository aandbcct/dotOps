name: dotops-local
services:
  neo4j:
    image: neo4j:5-community
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/password
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./aiops-platform/backend
    container_name: aiops-backend
    env_file: .env.local
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      DATABASE_URL: sqlite:///./data/aiops.db
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: admin123
      PROMETHEUS_URL: http://prometheus:9090
      TEMPO_URL: http://tempo:3200
      OTEL_ENDPOINT: http://otel-collector:4317
      SSH_USER: dotops
      SSH_KEY_PATH: /root/.ssh/retail_ed25519
      SSH_STRICT_HOST_KEY_CHECK: "true"
      CMDB_SERVICE_LIST: '["ui","catalog","cart","checkout","orders","catalog-db","orders-db","carts-db","checkout-redis","rabbitmq","opensearch"]'
      # Windows 目录挂载使用轮询监听，避免文件变更事件丢失。
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --reload-dir
      - /app/skills
      - --reload-include
      - "*.py"
      - --reload-include
      - "*.md"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:18000:8000"]
    volumes:
      # 源码只读挂载，运行数据仍写入独立数据卷。
      - ./aiops-platform/backend:/app:ro
      - backend-data:/app/data
      # SSH 文件放在 Linux 数据卷内，保留客户端要求的文件权限。
      - backend-ssh:/root/.ssh
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./aiops-platform/frontend
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./aiops-platform/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    user: root
    volumes:
      - ./otel-observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports: ["127.0.0.1:3200:3200"]
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes: ["./deploy/local/otel-collector.yml:/etc/otel-collector-config.yaml:ro"]
    # 仅在本机和 VMware NAT 网卡接收实验虚拟机的遥测数据。
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "192.168.108.1:4318:4318"]
    depends_on: [tempo, loki]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - ./deploy/local/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/local/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/retail.yaml:ro
      - ./deploy/local/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local.yaml"]
    volumes:
      - ./deploy/local/loki.yml:/etc/loki/local.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/local/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
volumes:
  neo4j-data:
  backend-data:
  backend-ssh:
  tempo-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
